<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-HAMRA PREMIUM SHOP</title>
<style>
  :root{
    --bg:#04050a;
    --line:#7fa8ff;
    --glow-a:#8ab4ff;
    --glow-b:#c9a7ff;
    --text-dim:#7b8296;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ width:100%; height:100%; }

  body{
    background: radial-gradient(circle at 50% 40%, #0a0d18 0%, var(--bg) 70%);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    color:#e8ecf7;
    overflow:hidden;
    position:relative;
  }

  canvas#net{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  .stage{
    position:relative;
    z-index:2;
    min-height:100vh;
    min-height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 6vw;
    pointer-events:none;
  }

  .stage > *{ pointer-events:auto; }

  img {
    width: 12rem;
    height: 12rem;
    margin-bottom: 3rem;

  }

  .kicker{
    font-size:0.9rem;
    letter-spacing:0.4em;
    color:var(--text-dim);
    margin-bottom:0.8rem;
    font-weight:400;
  }

  h1{
    font-size:clamp(2.3rem, 7.5vw, 5rem);
    font-weight:600;
    line-height:1.05;
    color:#f4f6ff;
    letter-spacing:-0.01em;
    margin-bottom: 2.5rem;
    text-shadow:
      0 0 20px rgba(138,180,255,0.35),
      0 0 50px rgba(201,167,255,0.18);
  }

  p.sub{
    margin-top:0.8rem;
    max-width:65%;
    font-size:clamp(0.95rem, 1.9vw, 1.1rem);
    color:var(--text-dim);
    font-weight:300;
    line-height:1.5;
    letter-spacing:0.065em;
  }


  .note{
    margin-top:1.1rem;
    font-size:0.76rem;
    color:#4c5265;
    height:1em;
  }
</style>
</head>
<body>

<canvas id="net"></canvas>

<div class="stage">
  <img src="alhamra-logo.png" alt="Al-Hamra Premium Shop Logo">
  <div class="kicker">SOMETHING NEW IS ON THE WAY</div>
  <h1>Coming Soon</h1>
  <p class="sub">We're putting the finishing touches on something we think you'll like.</p>
  <p class="sub"> Keep your excitement alive!</p>


  <div class="note" id="note"></div>
</div>

<script>
  const canvas = document.getElementById('net');
  const ctx = canvas.getContext('2d');
  let w, h, points;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', () => {
    resize();
    makePoints();
  });
  resize();

  function pointCount(){
    const area = w * h;
    return Math.min(Math.round(area / 16000), 110);
  }

  function makePoints(){
    const n = pointCount();
    points = Array.from({length: n}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.3 + 0.8
    }));
  }
  makePoints();

  let mouseX = -9999, mouseY = -9999;
  window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  window.addEventListener('mouseleave', () => {
    mouseX = -9999; mouseY = -9999;
  });
  window.addEventListener('touchmove', e => {
    if(e.touches[0]){
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
    }
  }, { passive:true });

  const LINK_DIST = 130;
  const MOUSE_DIST = 160;

  function tick(){
    ctx.clearRect(0, 0, w, h);

    // move points
    for(const p of points){
      p.x += p.vx;
      p.y += p.vy;

      if(p.x < 0 || p.x > w) p.vx *= -1;
      if(p.y < 0 || p.y > h) p.vy *= -1;

      p.x = Math.max(0, Math.min(w, p.x));
      p.y = Math.max(0, Math.min(h, p.y));
    }

    // draw links
    for(let i = 0; i < points.length; i++){
      for(let j = i + 1; j < points.length; j++){
        const a = points[i], b = points[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < LINK_DIST){
          const alpha = (1 - dist / LINK_DIST) * 0.35;
          ctx.strokeStyle = `rgba(140,175,255,${alpha})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }

      // link to mouse
      const dxm = points[i].x - mouseX, dym = points[i].y - mouseY;
      const distM = Math.sqrt(dxm*dxm + dym*dym);
      if(distM < MOUSE_DIST){
        const alpha = (1 - distM / MOUSE_DIST) * 0.5;
        ctx.strokeStyle = `rgba(201,167,255,${alpha})`;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(points[i].x, points[i].y);
        ctx.lineTo(mouseX, mouseY);
        ctx.stroke();
      }
    }

    // draw points
    for(const p of points){
      ctx.beginPath();
      ctx.fillStyle = 'rgba(210,222,255,0.85)';
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(tick);
  }
  tick();

  // Form handling (front-end only)
  const form = document.getElementById('notifyForm');
  const note = document.getElementById('note');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    note.textContent = "Thanks — we'll be in touch.";
    form.reset();
  });
</script>

</body>
</html>
